[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
db = { workspace = true }
network = { workspace = true }
contract = { workspace = true }
account = { workspace = true }
bcs = { workspace = true }
risc0-zkvm = { workspace = true, features = ["disable-dev-mode", "prove"] }
# risc0-zkvm = { workspace = true}
tx = { workspace = true }
