[package]
name = "aprova"
version = "0.1.0"
edition = "2024"
authors = ["marmot"]

[workspace]
members = [
    "account",
    "apps", "keygen",
]

[dependencies]
chrono = "0.4"
sha2 = "0.10.9"
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["net", "io-util", "io-std", "macros", "rt", "rt-multi-thread", "sync", "time"] }
hex = "0.4"
log = "0.4"

[workspace.dependencies]
tracing = { version="0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = { version = "0.15.0" }
anyhow = { version = "1.0" }
account = { path="account" }
