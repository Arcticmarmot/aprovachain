[package]
name = "aprova"
version = "0.1.0"
edition = "2024"
authors = ["marmot"]

[workspace]
members = ["account", "schedule", "front", "spec", "keygen", "validator", "engine", "methods", "methods/pass", "methods/fibonacci",
    "methods/ledger_guest", "methods/smallbank_guest", "apps", "apps/ledger", "apps/smallbank", "prover", "db", "prover/server", "orderer", "orderer/consensus",
    "primitives", "tx", "contract", "network", "chain", "platform", "schedule", "engine", "task", "bench"]

[dependencies]

[workspace.dependencies]
account = { path = "account" }
apps = { path = "apps" }
bench = { path = "bench" }
schedule = { path = "schedule" }
tx = { path = "tx" }
task = { path = "task" }
engine = { path = "engine" }
primitives = { path="primitives" }
spec = { path = "spec" }
contract = { path = "contract" }
chain = { path = "chain" }
network = { path = "network" }
consensus = { path = "orderer/consensus" }
db = { path = "db" }
server = { path = "prover/server" }
ledger = { path = "apps/ledger" }
smallbank = { path = "apps/smallbank" }
platform = { path = "platform" }

directories = { version = "6" }
tracing = { version="0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = { version = "0.15.0" }
anyhow = { version = "1.0" }
hex = { version = "0.4" }
sha2 = {version = "0.10"}
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
thiserror = "2"
bech32 = { version = "0.11" }
rand = { version = "0.9" , features = ["std_rng"]}
rand_core = { version="0.9", features = ["os_rng", "std"] }
rand_distr = { version = "0.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
serde_with = { version = "3", features = ["macros", "hex"] }
tokio = { version = "1.0", features = ["signal", "net", "io-util", "io-std", "macros",
    "rt", "rt-multi-thread", "sync", "time"] }
bcs = { version = "0.1" }
axum = { version = "0.8" }
once_cell = { version = "1" }
csv = { version = "1" }
risc0-zkvm = { version = "=3.0.3" }
risc0-build = { version = "=3.0.3" }
libp2p = { version = "0.56", features = [
    "tokio", "noise", "yamux", "macros",
    "tcp", "dns", "websocket", "quic",
    "identify", "kad", "mdns", "ping", "gossipsub",
] }
parking_lot = { version = "0.12" }


[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev-deps-o1]
inherits = "dev"
opt-level = 0

[profile.dev-deps-o1.package."*"]
opt-level = 1

[profile.dev-o1]
inherits = "dev"
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true

[profile.release-like]
inherits = "release"
opt-level = 0