[package]
name = "aprova"
version = "0.1.0"
edition = "2024"
authors = ["marmot"]

[workspace]
members = [
    "account",
    "apps", "chain", "keygen", "node", "primitives", "tx",
]

[dependencies]
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
log = "0.4"

[workspace.dependencies]
account = { path="account" }
tx = { path="tx" }
primitives = { path="primitives" }
chain = { path = "chain" }

tracing = { version="0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = { version = "0.15.0" }
anyhow = { version = "1.0" }
hex = { version = "0.4" }
sha2 = {version = "0.10"}
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
thiserror = "2"
bech32 = { version = "0.11" }
rand_core = { version="0.9", features = ["os_rng", "std"] }
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["net", "io-util", "io-std", "macros", "rt", "rt-multi-thread", "sync", "time"] }
base64 = { version = "0.22" }
bcs = { version = "0.1" }
serde_with = { version = "3", features = ["macros", "hex"] }
