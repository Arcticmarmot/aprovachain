[package]
name = "aprova"
version = "0.1.0"
edition = "2024"
authors = ["marmot"]

[workspace]
members = [
    "account", "apps", "spec", "methods", "methods/uav", "keygen", "node",
    "primitives", "tx", "contract", "network", "chain",
]

[dependencies]
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
log = "0.4"

[workspace.dependencies]
account = { path="account" }
tx = { path="tx" }
primitives = { path="primitives" }
spec = { path = "spec" }
methods = { path = "methods" }
node = { path = "node" }
contract = { path = "contract" }
chain = { path = "chain" }
network = { path = "network" }

directories = { version = "6" }
tracing = { version="0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = { version = "0.15.0" }
anyhow = { version = "1.0" }
hex = { version = "0.4" }
sha2 = {version = "0.10"}
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
thiserror = "2"
bech32 = { version = "0.11" }
rand = { version = "0.9" , features = ["std_rng"]}
rand_core = { version="0.9", features = ["os_rng", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
serde_with = { version = "3", features = ["macros", "hex"] }
tokio = { version = "1.0", features = ["signal", "net", "io-util", "io-std", "macros",
    "rt", "rt-multi-thread", "sync", "time"] }
bcs = { version = "0.1" }
axum = { version = "0.8" }
once_cell = { version = "1" }
risc0-zkvm = { version = "3" }
risc0-build = { version = "3" }

