[package]
name = "account"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1"
bech32 = { version = "0.7" }
merlin = "2"
rand = "0.8"
rand_core = { version="0.6" }
curve25519-dalek = { version = "3", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = { version = "0.10" }
serde = { version = "1.0", features=["derive"] }
hex = "0.4"